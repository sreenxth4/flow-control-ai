name: Capstone CI Workflow

on:
  push:
    branches:
      - main
      - capstone-workflow
  pull_request:
    branches:
      - main
      - capstone-workflow

jobs:
  frontend:
    name: Frontend CI (Build & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend CI (Syntax & Import Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Minimal Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask Flask-Cors numpy pytest

      - name: Python Syntax and Module Verification
        run: |
          python -m py_compile backend/app.py backend/config.py backend/run.py backend/schemas.py 
